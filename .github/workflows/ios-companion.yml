name: Build FlyPin Companion

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ios-companion-mvp
    paths:
      - "ios/Companion/**"
      - ".github/workflows/ios-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0.1"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/Companion
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios/Companion
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project FlyPinCompanion.xcodeproj \
            -scheme FlyPinCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlyPinCompanion-unsigned-app
          path: ios/Companion/build/DerivedData/Build/Products/Release-iphoneos/FlyPinCompanion.app
          if-no-files-found: error
          retention-days: 7
